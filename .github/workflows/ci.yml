name: CI

# A change of documents only does not change what the code and the tests
# do; the ADR workflow still checks it (ADR 0039).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read

# A new push to a pull request stops the run of the previous one. Every
# commit of main has a group of its own and keeps its run (ADR 0039).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  # The versions follow cabal.project, which follows ghcup's recommended
  # versions (ADR 0013).
  GHC_VERSION: '9.10.3'
  CABAL_VERSION: '3.16.1.0'
  # GHC and cabal go to /home/runner/toolchain/.ghcup, which is cached
  # (ADR 0039). The runner's ~/.ghcup is a link to a directory of root, which
  # the cache cannot restore.
  GHCUP_INSTALL_BASE_PREFIX: /home/runner/toolchain

jobs:
  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: /home/runner/toolchain/.ghcup
          key: ghcup-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ env.CABAL_VERSION }}
      - name: Install GHC and cabal
        id: toolchain
        run: |
          mkdir -p "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin"
          ghcup install ghc "$GHC_VERSION" --set
          ghcup install cabal "$CABAL_VERSION" --set
          echo "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin" >> "$GITHUB_PATH"
          # Without a config file, cabal also prints a note before the path.
          echo "store=$("$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin/cabal" path --store-dir | tail -n 1)" >> "$GITHUB_OUTPUT"
      # The build of the previous run; cabal compiles what changed since
      # (ADR 0039).
      - uses: actions/cache@v6
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal', '**/*.hs', '**/*.peg') }}
          restore-keys: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Resolve dependencies
        run: |
          cabal update
          cabal build all --dry-run
      - uses: actions/cache@v6
        with:
          path: ${{ steps.toolchain.outputs.store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-
      - name: Build
        run: cabal build all
      # The grammars of the repository are formatted (ADR 0032).
      - name: Check formatting of grammars
        run: $(cabal list-bin exe:peg-hs) fmt --check
      # The grammars of the repository have no warnings of the linter (ADR 0033).
      - name: Lint grammars
        run: $(cabal list-bin exe:peg-hs) lint
      # The five published packages have one version (ADR 0044).
      - name: Check versions
        run: |
          python3 scripts/versions.py self-test
          python3 scripts/versions.py check
      - name: Check packages
        run: |
          for p in packages/*; do
            (cd "$p" && cabal check)
          done

  # The test suites, in three jobs of about the same length. In a job, the
  # suites run one at a time, so that each has all the cores of the runner
  # for its tests (ADR 0041). The jobs restore the caches that the haskell
  # job saves.
  test:
    name: test-${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # peg-grammar-test runs in three parts (ADR 0042).
          - group: grammar-1
            suites: peg-grammar:test:peg-grammar-test
            options: --test-options='--shard 1/3'
          - group: grammar-2
            suites: peg-grammar:test:peg-grammar-test
            options: --test-options='--shard 2/3'
          - group: grammar-3
            suites: peg-grammar:test:peg-grammar-test
            options: --test-options='--shard 3/3'
          - group: conformance
            suites: >-
              peg-conformance:test:lua-conformance
              peg-conformance:test:toml-conformance
              peg-conformance:test:json-conformance
              peg-conformance:test:commonmark-conformance
              peg-conformance:test:complexity
          - group: packages
            suites: >-
              peg-cli:test:peg-cli-test
              peg-lsp:test:peg-lsp-test
              peg-codegen:test:peg-codegen-test
              peg-runtime:test:peg-runtime-test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6
        with:
          path: /home/runner/toolchain/.ghcup
          key: ghcup-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ env.CABAL_VERSION }}
      - name: Install GHC and cabal
        id: toolchain
        run: |
          mkdir -p "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin"
          ghcup install ghc "$GHC_VERSION" --set
          ghcup install cabal "$CABAL_VERSION" --set
          echo "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin" >> "$GITHUB_PATH"
          # Without a config file, cabal also prints a note before the path.
          echo "store=$("$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin/cabal" path --store-dir | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal', '**/*.hs', '**/*.peg') }}
          restore-keys: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Resolve dependencies
        run: |
          cabal update
          cabal build all --dry-run
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.toolchain.outputs.store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-
      - name: Build
        run: cabal build ${{ matrix.suites }}
      - name: Test
        run: cabal test -j1 --test-show-details=direct ${{ matrix.options }} ${{ matrix.suites }}

  # The documentation and the source tarballs, alongside the tests
  # (ADR 0039).
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6
        with:
          path: /home/runner/toolchain/.ghcup
          key: ghcup-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ env.CABAL_VERSION }}
      - name: Install GHC and cabal
        id: toolchain
        run: |
          mkdir -p "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin"
          ghcup install ghc "$GHC_VERSION" --set
          ghcup install cabal "$CABAL_VERSION" --set
          echo "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin" >> "$GITHUB_PATH"
          # Without a config file, cabal also prints a note before the path.
          echo "store=$("$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin/cabal" path --store-dir | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal', '**/*.hs', '**/*.peg') }}
          restore-keys: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Resolve dependencies
        run: |
          cabal update
          cabal build all --dry-run
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.toolchain.outputs.store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-
      # Every exposed module is fully documented (ADR 0044).
      - name: Haddock
        shell: bash
        run: cabal haddock peg-runtime peg-grammar peg-codegen peg-lsp 2>&1 | scripts/haddock-coverage.sh
      # Each published package must build from its source tarball alone
      # (ADR 0009).
      - name: Build from source tarballs
        run: |
          cabal sdist packages/peg-runtime packages/peg-grammar packages/peg-codegen packages/peg-lsp packages/peg-cli --output-directory "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP/sdist"
          for t in *.tar.gz; do tar xzf "$t"; done
          printf 'packages: */*.cabal\nwith-compiler: ghc-%s\n' "$GHC_VERSION" > cabal.project
          cabal build all

  # The editor grammars (ADR 0034).
  editors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm test
      # The generated parser is committed and up to date.
      - run: git diff --exit-code -- tree-sitter-peg/src
