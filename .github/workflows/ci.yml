name: CI

# A change of documents only (docs/** and **.md) does not change what the
# code and the tests do; the ADR workflow still checks it (ADR 0039). A push
# to main skips the workflow by paths-ignore. A pull request always runs it,
# the job changes skips the other jobs, and the job ci reports one result,
# the check that main requires with adr (ADR 0072). Keep the two conditions
# the same.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:

permissions:
  contents: read

# A new push to a pull request stops the run of the previous one. Every
# commit of main has a group of its own and keeps its run (ADR 0039).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  # The versions follow cabal.project, which follows ghcup's recommended
  # versions (ADR 0013).
  GHC_VERSION: '9.10.3'
  CABAL_VERSION: '3.16.1.0'
  # GHC and cabal go to /home/runner/toolchain/.ghcup, which is cached
  # (ADR 0039). The runner's ~/.ghcup is a link to a directory of root, which
  # the cache cannot restore.
  GHCUP_INSTALL_BASE_PREFIX: /home/runner/toolchain

jobs:
  # Whether the pull request changes anything besides documents (ADR 0072).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            code=true
          elif git diff --name-only "$BASE...$HEAD" | grep -v -e '^docs/' -e '\.md$' > /dev/null; then
            code=true
          else
            code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  haskell:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: /home/runner/toolchain/.ghcup
          key: ghcup-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ env.CABAL_VERSION }}
      - name: Install GHC and cabal
        id: toolchain
        run: |
          mkdir -p "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin"
          ghcup install ghc "$GHC_VERSION" --set
          ghcup install cabal "$CABAL_VERSION" --set
          echo "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin" >> "$GITHUB_PATH"
          # Without a config file, cabal also prints a note before the path.
          echo "store=$("$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin/cabal" path --store-dir | tail -n 1)" >> "$GITHUB_OUTPUT"
      # The build of the previous run; cabal compiles what changed since
      # (ADR 0039).
      - uses: actions/cache@v6
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal', '**/*.hs', '**/*.hpeg') }}
          restore-keys: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Resolve dependencies
        run: |
          cabal update
          cabal build all --dry-run
      - uses: actions/cache@v6
        with:
          path: ${{ steps.toolchain.outputs.store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-
      - name: Build
        run: cabal build all
      # The grammars of the repository are formatted (ADR 0032).
      - name: Check formatting of grammars
        run: $(cabal list-bin exe:peg-hs) fmt --check
      # The grammars of the repository have no warnings of the linter (ADR 0033).
      - name: Lint grammars
        run: $(cabal list-bin exe:peg-hs) lint
      # The five published packages have one version (ADR 0044).
      - name: Check versions
        run: |
          python3 scripts/versions.py self-test
          python3 scripts/versions.py check
      - name: Check packages
        run: |
          for p in packages/*; do
            (cd "$p" && cabal check)
          done

  # The test suites, in three jobs of about the same length. In a job, the
  # suites run one at a time, so that each has all the cores of the runner
  # for its tests (ADR 0041). The jobs restore the caches that the haskell
  # job saves.
  test:
    name: test-${{ matrix.group }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # peg-grammar-test runs in three parts (ADR 0042).
          - group: grammar-1
            suites: peg-grammar:test:peg-grammar-test
            options: --test-options='--shard 1/3'
          - group: grammar-2
            suites: peg-grammar:test:peg-grammar-test
            options: --test-options='--shard 2/3'
          - group: grammar-3
            suites: peg-grammar:test:peg-grammar-test
            options: --test-options='--shard 3/3'
          - group: conformance
            suites: >-
              peg-conformance:test:lua-conformance
              peg-conformance:test:toml-conformance
              peg-conformance:test:json-conformance
              peg-conformance:test:commonmark-conformance
              peg-conformance:test:complexity
          - group: packages
            suites: >-
              peg-cli:test:peg-cli-test
              peg-lsp:test:peg-lsp-test
              peg-codegen:test:peg-codegen-test
              peg-runtime:test:peg-runtime-test
              peg-wasm:test:peg-wasm-test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6
        with:
          path: /home/runner/toolchain/.ghcup
          key: ghcup-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ env.CABAL_VERSION }}
      - name: Install GHC and cabal
        id: toolchain
        run: |
          mkdir -p "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin"
          ghcup install ghc "$GHC_VERSION" --set
          ghcup install cabal "$CABAL_VERSION" --set
          echo "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin" >> "$GITHUB_PATH"
          # Without a config file, cabal also prints a note before the path.
          echo "store=$("$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin/cabal" path --store-dir | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal', '**/*.hs', '**/*.hpeg') }}
          restore-keys: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Resolve dependencies
        run: |
          cabal update
          cabal build all --dry-run
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.toolchain.outputs.store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-
      - name: Build
        run: cabal build ${{ matrix.suites }}
      - name: Test
        run: cabal test -j1 --test-show-details=direct ${{ matrix.options }} ${{ matrix.suites }}

  # The documentation, alongside the tests (ADR 0039). Every exposed
  # module is fully documented (ADR 0044).
  haddock:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6
        with:
          path: /home/runner/toolchain/.ghcup
          key: ghcup-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ env.CABAL_VERSION }}
      - name: Install GHC and cabal
        id: toolchain
        run: |
          mkdir -p "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin"
          ghcup install ghc "$GHC_VERSION" --set
          ghcup install cabal "$CABAL_VERSION" --set
          echo "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin" >> "$GITHUB_PATH"
          # Without a config file, cabal also prints a note before the path.
          echo "store=$("$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin/cabal" path --store-dir | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal', '**/*.hs', '**/*.hpeg') }}
          restore-keys: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Resolve dependencies
        run: |
          cabal update
          cabal build all --dry-run
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.toolchain.outputs.store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-
      - name: Haddock
        shell: bash
        run: cabal haddock peg-runtime peg-grammar peg-codegen peg-lsp 2>&1 | scripts/haddock-coverage.sh

  # Each published package builds and passes its tests from its source
  # tarball alone (ADR 0009, ADR 0046). Tests of files outside a package
  # report that they were skipped. peg-grammar-test runs in three parts, as
  # in the test jobs; the other suites run in the second part, the shortest
  # one (ADR 0051).
  sdist:
    name: sdist-${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            others: ''
          - shard: 2
            others: peg-runtime:test:peg-runtime-test peg-codegen:test:peg-codegen-test peg-lsp:test:peg-lsp-test peg-cli:test:peg-cli-test
          - shard: 3
            others: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6
        with:
          path: /home/runner/toolchain/.ghcup
          key: ghcup-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ env.CABAL_VERSION }}
      - name: Install GHC and cabal
        id: toolchain
        run: |
          mkdir -p "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin"
          ghcup install ghc "$GHC_VERSION" --set
          ghcup install cabal "$CABAL_VERSION" --set
          echo "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin" >> "$GITHUB_PATH"
          # Without a config file, cabal also prints a note before the path.
          echo "store=$("$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin/cabal" path --store-dir | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal', '**/*.hs', '**/*.hpeg') }}
          restore-keys: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Resolve dependencies
        run: |
          cabal update
          cabal build all --dry-run
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.toolchain.outputs.store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-
      - name: Test from source tarballs
        shell: bash
        run: |
          cabal sdist packages/peg-runtime packages/peg-grammar packages/peg-codegen packages/peg-lsp packages/peg-cli --output-directory "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP/sdist"
          for t in *.tar.gz; do tar xzf "$t"; done
          printf 'packages: */*.cabal\nwith-compiler: ghc-%s\ntests: True\n' "$GHC_VERSION" > cabal.project
          cabal build all
          cabal test -j1 --test-show-details=direct peg-grammar:test:peg-grammar-test --test-options='--shard ${{ matrix.shard }}/3' | tee test.log
          if [ -n "${{ matrix.others }}" ]; then
            cabal test -j1 --test-show-details=direct ${{ matrix.others }} | tee -a test.log
          fi
          echo "skipped tests: $(grep -c 'skipped:' test.log)"
          grep 'skipped:' test.log | sort | uniq -c

  # The editor grammars (ADR 0034).
  editors:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm test
      # The generated parser is committed and up to date.
      - run: git diff --exit-code -- tree-sitter-hpeg/src

  # The wasm reactor (ADR 0078, ADR 0079): built with the toolchain of the
  # ghc-wasm-meta flake at a fixed commit, and tested with Deno against the
  # native peg-hs built in this job.
  wasm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      GHC_WASM_META: gitlab:haskell-wasm/ghc-wasm-meta/8079eb96bbc63823d99ad8acaff0765532625474?host=gitlab.haskell.org#all_9_10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v6
        with:
          path: /home/runner/toolchain/.ghcup
          key: ghcup-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ env.CABAL_VERSION }}
      - name: Install GHC and cabal
        id: toolchain
        run: |
          mkdir -p "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin"
          ghcup install ghc "$GHC_VERSION" --set
          ghcup install cabal "$CABAL_VERSION" --set
          echo "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin" >> "$GITHUB_PATH"
          # Without a config file, cabal also prints a note before the path.
          echo "store=$("$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin/cabal" path --store-dir | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: dist-newstyle
          key: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', '**/*.cabal', '**/*.hs', '**/*.hpeg') }}
          restore-keys: dist-${{ runner.os }}-${{ env.GHC_VERSION }}-
      - name: Resolve dependencies
        run: |
          cabal update
          cabal build all --dry-run
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.toolchain.outputs.store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-
      - name: Build the native peg-hs
        run: |
          cabal build exe:peg-hs
          echo "PEG_HS=$(cabal list-bin exe:peg-hs)" >> "$GITHUB_ENV"
      # Upstream Nix, which checks the downloads of the flake against
      # flake.lock and the hashes of the flake.
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - name: Build the wasm
        run: |
          nix shell "$GHC_WASM_META" -c wasm32-wasi-cabal update
          nix shell "$GHC_WASM_META" -c scripts/build-wasm.sh "$RUNNER_TEMP/peg-hs.wasm" "$RUNNER_TEMP/raw.wasm"
          ls -l "$RUNNER_TEMP/peg-hs.wasm" "$RUNNER_TEMP/raw.wasm"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test the wasm
        env:
          PEG_HS_WASM: ${{ runner.temp }}/peg-hs.wasm
          PEG_HS_WASM_RAW: ${{ runner.temp }}/raw.wasm
        run: deno test --allow-read --allow-write --allow-env --allow-run wasm/test

  # One result for the branch protection of main (ADR 0072): it fails when a
  # job failed or was cancelled, and passes when every job passed or was
  # skipped because only documents changed. A new job goes to needs.
  ci:
    needs: [changes, haskell, test, haddock, sdist, editors, wasm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
