name: ADR

# Committed ADRs and benchmark records are immutable, and each ADR has
# exactly one status line. This runs on every change, documents included
# (ADR 0039, ADR 0043).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tett23/adr-guard@v0.8.0
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          allow-status: true
          allow-links: true
