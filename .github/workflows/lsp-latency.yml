name: LSP median latency

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GHC_VERSION: '9.10.3'
  CABAL_VERSION: '3.16.1.0'
  GHCUP_INSTALL_BASE_PREFIX: /home/runner/toolchain

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      measure: ${{ steps.diff.outputs.measure }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          measure=$(node scripts/lsp-monitor-changes.mjs "$BEFORE" "$HEAD")
          echo "measure=$measure" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: changes
    if: needs.changes.outputs.measure == 'true'
    runs-on: ubuntu-latest
    outputs:
      exceeded: ${{ steps.median.outputs.exceeded }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/cache@v6
        with:
          path: /home/runner/toolchain/.ghcup
          key: ghcup-${{ runner.os }}-${{ env.GHC_VERSION }}-${{ env.CABAL_VERSION }}
      - name: Prepare toolchain
        run: |
          mkdir -p "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin"
          ghcup install ghc "$GHC_VERSION" --set
          ghcup install cabal "$CABAL_VERSION" --set
          echo "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin" >> "$GITHUB_PATH"
      # scripts/lsp-measure.sh measures, the same as the judgment of pull
      # requests (ADR 0102).
      - name: Build and measure the pushed commit
        run: |
          {
            echo "## LSP median latency"
            echo
            echo "Commit: $GITHUB_SHA. Memo: conformance/bench/Memo.hpeg at $GITHUB_SHA. Golem: $(sed -n 's/^golem=//p' scripts/lsp-measure.sh)."
            echo "Runner: $ImageOS $ImageVersion ($(uname -m)); GHC $(ghc --numeric-version); Cabal $(cabal --numeric-version)."
            echo 'Options: -O1, Criterion --match pattern range, RTS -A64m.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          cabal update
          scripts/lsp-measure.sh conformance/bench/Memo.hpeg "$RUNNER_TEMP/measured"
      - name: Record all twelve medians
        id: median
        run: node scripts/lsp-median.mjs "$RUNNER_TEMP/measured/Memo.json" "$RUNNER_TEMP/measured/Golem.json" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  notify:
    needs: benchmark
    if: needs.benchmark.outputs.exceeded != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: lsp-median-issue
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Create or update the monitoring issue
        env:
          EXCEEDED: ${{ needs.benchmark.outputs.exceeded }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/lsp-median-issue.mjs
